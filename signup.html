<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeTravel — Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .card-icon {
      width:60px;height:60px;border-radius:16px;margin:0 auto 1rem;
      background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(139,92,246,.25));
      border:1px solid rgba(99,102,241,.3);display:flex;align-items:center;
      justify-content:center;font-size:1.6rem;color:#a5b4fc;
    }
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
    .otp-row{display:flex;gap:.6rem;align-items:flex-start;}
    .otp-email-group{flex:1;margin-bottom:0!important;}
    .btn-otp{
      background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);
      color:#a5b4fc;padding:.85rem 1rem;border-radius:12px;cursor:pointer;
      font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;
      white-space:nowrap;flex-shrink:0;
    }
    .btn-otp:disabled{opacity:.5;cursor:not-allowed;}
    #otp-status-box{
      display:none;margin:.6rem 0;padding:.8rem 1rem;border-radius:10px;
      font-size:.85rem;font-weight:500;
      background:rgba(6,214,160,.12);border:1px solid rgba(6,214,160,.3);color:#6ee7b7;
    }
    #otp-status-box.err{
      background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5;
    }
    #otp-field{display:none;}
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i><span>WeTravel</span>
      </a>
      <nav>
        <a href="login.html" class="nav-link">Already a member?</a>
        <a href="login.html" class="btn-primary">Login</a>
      </nav>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="form-card">
      <div style="text-align:center;margin-bottom:1.8rem;">
        <div class="card-icon"><i class="fas fa-user-astronaut"></i></div>
        <h2>Create Account</h2>
        <p class="subtitle">Join thousands of travelers worldwide</p>
      </div>

      <div id="alert-box" class="alert"></div>

      <!-- onsubmit="return false" stops ANY accidental page refresh -->
      <form id="signup-form" onsubmit="return false;" action="javascript:void(0);">

        <div class="form-group">
          <span class="fi"><i class="fas fa-user"></i></span>
          <input type="text" id="username" placeholder="Username" autocomplete="off">
        </div>

        <div class="form-group">
          <span class="fi"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" placeholder="Email address" autocomplete="off"
                 oninput="document.getElementById('otp-email-display').value=this.value">
        </div>

        <div class="form-row">
          <div class="form-group">
            <span class="fi"><i class="fas fa-id-card"></i></span>
            <select id="id-proof">
              <option value="" disabled selected>ID Type</option>
              <option value="aadhar">Aadhar Card</option>
              <option value="pan">PAN Card</option>
              <option value="voter">Voter ID</option>
              <option value="passport">Passport</option>
            </select>
          </div>
          <div class="form-group">
            <span class="fi"><i class="fas fa-hashtag"></i></span>
            <input type="text" id="id-proof-number" placeholder="ID Number">
          </div>
        </div>

        <div class="form-group">
          <span class="fi"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" placeholder="Password (min 6 chars)">
        </div>

        <div class="form-group">
          <span class="fi"><i class="fas fa-shield-alt"></i></span>
          <input type="password" id="confirm-password" placeholder="Confirm Password">
        </div>

        <div class="section-divider">Verify Email</div>

        <div class="otp-row">
          <div class="form-group otp-email-group">
            <span class="fi"><i class="fas fa-at"></i></span>
            <input type="text" id="otp-email-display" placeholder="Enter email above first" readonly>
          </div>
          <!-- onclick directly on button — works even if addEventListener fails -->
          <button type="button" id="generate-otp-btn" class="btn-otp" onclick="generateOTP()">
            <i class="fas fa-key"></i>&nbsp;Send OTP
          </button>
        </div>

        <div id="otp-status-box"></div>

        <div class="form-group" id="otp-field">
          <span class="fi"><i class="fas fa-shield-check"></i></span>
          <input type="text" id="otp-code" placeholder="Paste the OTP shown above" maxlength="6">
        </div>

        <!-- type="button" means this NEVER submits the form -->
        <button type="button" id="signup-btn" class="btn-submit" onclick="doSignup()">
          Create Account &nbsp;<i class="fas fa-arrow-right"></i>
        </button>

      </form>

      <div class="form-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <!-- v5 added to bypass browser cache -->
  <script src="signup.js?v=5"></script>
</body>
</html>
