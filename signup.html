<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeTravel — Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i><span>WeTravel</span>
      </a>
      <nav>
        <a href="login.html" class="nav-link">Already a member?</a>
        <a href="login.html" class="btn-primary">Login</a>
      </nav>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="form-card">
      <div class="card-header">
        <div class="card-icon"><i class="fas fa-user-astronaut"></i></div>
        <h2>Create Account</h2>
        <p class="subtitle">Join thousands of travelers worldwide</p>
      </div>

      <div id="alert-box" class="alert"></div>

      <form id="signup-form" autocomplete="off">
        <div class="form-group">
          <span class="fi"><i class="fas fa-user"></i></span>
          <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="form-group">
          <span class="fi"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" placeholder="Email address" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <span class="fi"><i class="fas fa-id-card"></i></span>
            <select id="id-proof" required>
              <option value="" disabled selected>ID Proof Type</option>
              <option value="aadhar">Aadhar Card</option>
              <option value="pan">PAN Card</option>
              <option value="voter">Voter ID Card</option>
              <option value="passport">Passport</option>
            </select>
          </div>
          <div class="form-group">
            <span class="fi"><i class="fas fa-hashtag"></i></span>
            <input type="text" id="id-proof-number" placeholder="ID Number" required>
          </div>
        </div>

        <div class="form-group">
          <span class="fi"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" placeholder="Password (min 6 characters)" required>
        </div>

        <div class="form-group">
          <span class="fi"><i class="fas fa-shield-alt"></i></span>
          <input type="password" id="confirm-password" placeholder="Confirm Password" required>
        </div>

        <div class="section-divider">Email Verification</div>

        <div class="otp-row">
          <div class="form-group otp-email-group">
            <span class="fi"><i class="fas fa-at"></i></span>
            <input type="text" id="otp-email-display" placeholder="Your email (auto-filled)" readonly>
          </div>
          <button type="button" id="generate-otp-btn" class="btn-otp">
            <i class="fas fa-key"></i> Send OTP
          </button>
        </div>

        <div id="otp-status-box" style="display:none;" class="otp-status-box"></div>

        <div class="form-group" id="otp-field" style="display:none;">
          <span class="fi"><i class="fas fa-shield-check"></i></span>
          <input type="text" id="otp-code" placeholder="Enter 6-digit OTP" maxlength="6" pattern="\d{6}">
        </div>

        <button type="submit" id="signup-btn" class="btn-submit">
          Create Account &nbsp;<i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="form-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <style>
    .card-header { text-align: center; margin-bottom: 1.8rem; }
    .card-icon {
      width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 1rem;
      background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.25));
      border: 1px solid rgba(99,102,241,0.3); display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: #a5b4fc;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .otp-row { display: flex; gap: 0.6rem; align-items: flex-start; margin-bottom: 0; }
    .otp-email-group { flex: 1; margin-bottom: 0; }
    .btn-otp {
      background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.35);
      color: #a5b4fc; padding: 0.85rem 1rem; border-radius: 12px;
      cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600;
      font-size: 0.82rem; white-space: nowrap; transition: background 0.2s, transform 0.2s;
      display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0;
    }
    .btn-otp:hover { background: rgba(99,102,241,0.25); transform: translateY(-1px); }
    .btn-otp:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .otp-status-box {
      margin: 0.6rem 0; padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.82rem;
      background: rgba(6,214,160,0.1); border: 1px solid rgba(6,214,160,0.28); color: #6ee7b7;
    }
    .otp-status-box.error {
      background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.28); color: #fca5a5;
    }
    .form-group input[readonly] { cursor: default; color: #64748b; }
  </style>

  <script src="signup.js"></script>
</body>
</html>
