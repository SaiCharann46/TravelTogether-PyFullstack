<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeTravel — Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i><span>WeTravel</span>
      </a>
      <nav>
        <a href="signup.html" class="nav-link">New here?</a>
        <a href="signup.html" class="btn-primary">Sign Up Free</a>
      </nav>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="form-card">
      <div class="card-header" style="text-align:center; margin-bottom:1.8rem;">
        <div class="card-icon"><i class="fas fa-plane"></i></div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue your journey</p>
      </div>

      <div id="alert-box" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <span class="fi"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" placeholder="Email address" required>
        </div>

        <div class="form-group">
          <span class="fi"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" placeholder="Password" required>
          <span class="fi-right" id="toggle-pw" title="Show/hide password">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <button type="submit" id="login-btn" class="btn-submit">
          Login &nbsp;<i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="signup.html">Sign up here</a>
      </div>
    </div>
  </div>

  <style>
    .card-icon {
      width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 1rem;
      background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.25));
      border: 1px solid rgba(99,102,241,0.3); display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: #a5b4fc;
    }
    .fi-right {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      color: #64748b; cursor: pointer; font-size: 0.875rem; transition: color 0.2s;
    }
    .fi-right:hover { color: #a5b4fc; }
    .form-group { position: relative; }
  </style>

  <script src="login.js"></script>
</body>
</html>
