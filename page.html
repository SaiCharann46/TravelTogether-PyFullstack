<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeTravel — Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i><span>WeTravel</span>
      </a>
      <nav>
        <span id="nav-username" class="nav-link" style="color:#a5b4fc;"></span>
        <a href="create.html" class="btn-primary"><i class="fas fa-plus"></i> Create Group</a>
        <a href="join.html" class="btn-outline-nav"><i class="fas fa-door-open"></i> Join Group</a>
        <button id="logout-btn" class="btn-logout" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
      </nav>
    </div>
  </header>

  <div class="dashboard-wrapper">
    <div class="dash-header">
      <h1>Find Your <span class="gradient-text">Travel Group</span></h1>
      <p id="dash-greeting">Search for groups by destination or browse all available trips.</p>
    </div>

    <form id="search-form" class="dash-search">
      <div class="search-inner">
        <i class="fas fa-map-marker-alt"></i>
        <input type="text" id="search" placeholder="Search destination — Goa, Manali, Kerala...">
      </div>
      <button type="submit" class="btn-search">
        <i class="fas fa-search"></i> Search
      </button>
    </form>

    <div class="action-cards">
      <a href="create.html" class="action-card">
        <div class="ac-icon"><i class="fas fa-plus-circle"></i></div>
        <div>
          <span>Create a Group</span>
          <small>Start your own travel group</small>
        </div>
      </a>
      <a href="join.html" class="action-card">
        <div class="ac-icon purple"><i class="fas fa-door-open"></i></div>
        <div>
          <span>Join a Group</span>
          <small>Enter group name &amp; code</small>
        </div>
      </a>
    </div>

    <div id="results-section" style="display:none;">
      <h3 class="results-title"><i class="fas fa-list"></i> Search Results</h3>
      <ul id="results-list" class="results-list"></ul>
    </div>
  </div>

  <style>
    .dashboard-wrapper { max-width: 900px; margin: 0 auto; padding: 8rem 2rem 3rem; }
    .dash-header { text-align: center; margin-bottom: 2.5rem; }
    .dash-header h1 { font-size: 2.8rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
    .dash-header p { color: #64748b; font-size: 0.95rem; }
    .dash-search {
      display: flex; gap: 0.5rem;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 0.5rem; margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }
    .search-inner { display: flex; align-items: center; gap: 0.8rem; flex: 1; padding: 0 0.8rem; }
    .search-inner i { color: #6366f1; }
    .search-inner input {
      background: none; border: none; outline: none;
      color: #e2e8f0; font-family: 'Poppins', sans-serif; font-size: 0.95rem; width: 100%;
    }
    .search-inner input::placeholder { color: #475569; }
    .btn-search {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 12px;
      cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.5rem; transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-search:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
    .action-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2.5rem; }
    .action-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px; padding: 1.3rem 1.5rem;
      display: flex; align-items: center; gap: 1rem; text-decoration: none;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
    }
    .action-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(99,102,241,0.3); transform: translateY(-2px); }
    .ac-icon {
      width: 50px; height: 50px; border-radius: 14px; display: flex;
      align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0;
      background: rgba(99,102,241,0.15); color: #a5b4fc;
    }
    .ac-icon.purple { background: rgba(139,92,246,0.15); color: #c4b5fd; }
    .action-card span { display: block; font-weight: 600; color: #fff; margin-bottom: 0.2rem; }
    .action-card small { color: #64748b; font-size: 0.8rem; }
    .results-title { color: #e2e8f0; font-size: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .results-list { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
    .results-list li {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 1rem 1.3rem; color: #e2e8f0; font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .results-list li i { color: #6366f1; }
    .btn-outline-nav {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0; padding: 0.55rem 1.1rem; border-radius: 50px;
      text-decoration: none; font-size: 0.85rem; font-weight: 500;
      display: flex; align-items: center; gap: 0.4rem; transition: background 0.2s;
    }
    .btn-outline-nav:hover { background: rgba(255,255,255,0.12); }
    .btn-logout {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5; width: 38px; height: 38px; border-radius: 10px;
      cursor: pointer; font-size: 0.9rem; transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(239,68,68,0.22); }
    @media (max-width: 600px) { .action-cards { grid-template-columns: 1fr; } .dash-header h1 { font-size: 2rem; } }
  </style>

  <script src="page.js"></script>
</body>
</html>
